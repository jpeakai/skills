# Which canonical skills each plugin composes.
#
# This file is the single declaration of the grouping. Everything under
# plugins/*/skills/ and plugins/*/hooks/ is generated from it:
#
#   uv run --project tools/plugin-ci plugin-ci sync           write the mirror
#   uv run --project tools/plugin-ci plugin-ci sync --check   report drift, change nothing
#
# Add a skill to a pack by naming it here and re-running the sync. Never by
# copying files into plugins/ — tools/plugin-ci/src/plugin_ci/commands/validate_plugins.py fails the build
# when a plugin tree and this file disagree.
#
# Skill names must match a directory under ../skills/ exactly, which is also
# the `name` in that skill's SKILL.md frontmatter.

plugins:

  # Documentation and diagramming. The pack most repos want.
  jpai-essentials:
    skills:
      - adr                  # set up, migrate, render and audit decision records
      - agnostic             # de-brand docs to generic placeholders
      - cli                  # build project-local developer CLIs
      - concise-decisions    # consolidate ambiguities into one briefed question
      - gooddocs             # audit, write and restructure documentation
      - librarian            # shelve docs into the canonical document set
      - mermaidjs-diagrams   # render + WCAG-contrast-check Mermaid diagrams
      - richdocs             # interactive HTML companions to markdown
      - snr-pr               # filter review results into Signal and Noise; prevent recurrence
      - tickety-boo          # follow a repo's TICKETING.md for tickets, WIP and cleanup
    hooks: true

  # Delivery workflow. Smaller and more specialised.
  jpai-delivery:
    skills:
      # All also appear in jpai-essentials: each stands alone.
      - snr-pr
      # Installing both packs is fine — each harness namespaces by plugin.
      - concise-decisions
      - tickety-boo
    hooks: false

  # Claude Code cloud session setup. Its scripts are also downloaded by the
  # environment's setup script from a ccw/vX.Y.Z tag.
  jpai-ccw:
    skills:
      - ccw-setup            # check and apply per-session cloud setup
    hooks: false
