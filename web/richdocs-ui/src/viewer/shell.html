<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<script>
  // Pre-paint theme resolution, deliberately inline and blocking so the page
  // never flashes the wrong theme:
  //   localStorage (explicit user toggle) -> tokens.defaultTheme -> prefers-color-scheme -> light
  //
  // defaultTheme is baked in at generation time rather than read from the token
  // file, because the token file is fetched later, long after first paint.
  (function () {
    var t = null;
    try { t = localStorage.getItem("richdocs-theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") { t = "{{DEFAULT_THEME}}"; }
    if (t !== "light" && t !== "dark") {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<!-- Generated by web/richdocs-ui (root ADR-0011): Tailwind, shadcn and the document styles. -->
<style>{{VIEWER_BUNDLE_CSS}}</style>
<!-- Sidebar and section folds, shared verbatim with the showcase (ADR-022). -->
<style>{{VIEWER_TOC_CSS}}</style>
<!-- Full-screen diagrams with deep zoom, shared with the showcase (ADR-024). -->
<style>{{VIEWER_ZOOM_CSS}}</style>
<!-- Per-brand overrides: webfont @imports, display face, chrome refinements.
     Comes last so a theme can override anything it needs. Empty when no
     --theme is selected. -->
<style>{{THEME_CSS}}</style>
<script src="{{CDN_MARKED}}"></script>
<script src="{{CDN_MERMAID}}"></script>
</head>
<body>
<!-- The React header mounts here; it carries #rd-toc-toggle and #rd-theme-toggle. -->
<div id="rd-header-root"></div>
<div class="rd-layout">
  <nav id="rd-toc" aria-label="Contents"></nav>
  <main><article id="rd-article">Loading…</article></main>
</div>
{{BOOTSTRAP}}
<!-- Everything md2html.py injects lives here, so the scripts stay placeholder-free. -->
<script type="application/json" id="rd-config">{{RD_CONFIG}}</script>
<!-- The classic helpers come first: the bundle calls their globals. -->

{{VIEWER_CYTOSCAPE_JS}}
</script>

</script>

{{VIEWER_ZOOM_JS}}
</script>

{{VIEWER_DECKGL_JS}}

{{VIEWER_BUNDLE_JS}}

</body>
</html>
