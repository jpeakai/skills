<script>
  // Pre-paint theme resolution, deliberately inline and blocking so the page
  // never flashes the wrong theme:
  //   localStorage (explicit user toggle) -> tokens.defaultTheme -> prefers-color-scheme -> light
  //
  // defaultTheme is baked in at generation time rather than read from the token
  // file, because the token file is fetched later — long after first paint.
  (function () {
    var t = null;
    try { t = localStorage.getItem("richdocs-theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") { t = "dark"; }
    if (t !== "light" && t !== "dark") {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>

Mermaid hue families\"]:::storage --> MR[\"mmdc renders\"]:::output\n  PP[\"Chart palettes per theme\"]:::storage --> RV\n  NONE[\"No shared plan\"]:::absent\n  classDef storage fill:#92400e,stroke:#fde68a,color:#ffffff\n  classDef output fill:#047857,stroke:#a7f3d0,color:#ffffff\n  classDef absent fill:#f1f5f9,stroke:#475569,color:#1e293b,stroke-dasharray:5 5\n```\n\n<details>\n<summary>BEFORE detail: where colour decisions lived<\/summary>\n\n```mermaid\nflowchart TB\n  T1[\"resources/themes/NAME/design-tokens.json\"]:::storage --> MD[\"md2html.py resolve_brand\"]:::process\n  T2[\"resources/themes/NAME/theme.css\"]:::storage --> MD\n  TC[\"themecheck.py contrast gate\"]:::process --> T1\n  MD --> V[\"viewer.js chrome and canvases\"]:::output\n  CT[\"color_theming.md hue per meaning\"]:::input --> AUTH[\"Author picks classDef colours\"]:::process\n  REC[\"color_palette_recipes.md\"]:::input --> AUTH\n  AUTH --> FENCE[\"mermaid fences\"]:::storage\n  FENCE --> RS[\"render_mermaid.sh -t dark or default\"]:::process\n  RS --> PNG[\"PNG variants\"]:::output\n  NOPLAN[\"No decision record across skills\"]:::absent\n  classDef input fill:#1d4ed8,stroke:#bfdbfe,color:#ffffff\n  classDef process fill:#6d28d9,stroke:#ddd6fe,color:#ffffff\n  classDef output fill:#047857,stroke:#a7f3d0,color:#ffffff\n  classDef storage fill:#92400e,stroke:#fde68a,color:#ffffff\n  classDef absent fill:#f1f5f9,stroke:#475569,color:#1e293b,stroke-dasharray:5 5\n```\n\n<\/details>\n\n### AFTER (implemented, head `78ef9b1`)\n\nOne plan, one pipeline, many readers.\n\n```mermaid\nflowchart TB\n  DEC[\"DECISIONS.md: 15 DT records\"]:::input --> CURD[\"CURATION.md stages\"]:::input\n  DEC --> MIG[\"MIGRATION.md M0 to M6\"]:::input\n  CURD --> PIPE[\"seed to IR to DTCG\"]:::process\n  MIG --> PIPE\n  PIPE --> REF[\"reference design-tokens.json\"]:::storage\n  classDef input fill:#1d4ed8,stroke:#bfdbfe,color:#ffffff\n  classDef process fill:#6d28d9,stroke:#ddd6fe,color:#ffffff\n  classDef storage fill:#92400e,stroke:#fde68a,color:#ffffff\n```\n\n<details>\n<summary>AFTER detail: which decision governs which part<\/summary>\n\n```mermaid\nflowchart TB\n  LOC[\"DT-LOC-1 shared store\"]:::input --> RES[\"profile_resolver.py\"]:::process\n  TOOL[\"DT-TOOL-1 own skill, copies not imports\"]:::input --> RES\n  PIPE[\"DT-PIPE-1 seed, IR, DTCG\"]:::input --> CUR[\"profiles.py Curator\"]:::process\n  BUILD[\"DT-BUILD-1 bake every surface\"]:::input --> CUR\n  REF1[\"DT-REF-1 OKLCH neutrals\"]:::input --> CUR\n  ACC[\"DT-ACCENT-1 one brand hue\"]:::input --> CUR\n  WALK[\"DT-WALK-1 and 2 twelve slots\"]:::input --> CUR\n  BORD[\"DT-BORDER-1 borders\"]:::input --> CUR\n  CON[\"DT-CONTRAST-1 AA by default\"]:::input --> SC[\"score_contrast\"]:::process\n  PROV[\"DT-PROV-1 hand edits kept\"]:::input --> ST[\"stated_values\"]:::process\n  ROLES[\"DT-ROLES-1 role names\"]:::input --> IR[\"ir.json roles\"]:::storage\n  CAT[\"DT-CAT-1 classes take slots\"]:::input --> MMD[\"color_theming.md slots\"]:::output\n  DT[\"DT-DTCG-1 resolver document\"]:::input --> BT[\"build_tokens\"]:::process\n  CVD[\"DT-CVD-1 low priority\"]:::input\n  CUR --> IR\n  ST --> CUR\n  IR --> SC\n  IR --> BT\n  BT --> OUT[\"design-tokens.json\"]:::storage\n  OUT --> RES\n  classDef input fill:#1d4ed8,stroke:#bfdbfe,color:#ffffff\n  classDef process fill:#6d28d9,stroke:#ddd6fe,color:#ffffff\n  classDef output fill:#047857,stroke:#a7f3d0,color:#ffffff\n  classDef storage fill:#92400e,stroke:#fde68a,color:#ffffff\n```\n\n<\/details>\n\n### Evidence\n\n`docs/plans/refactor-design-tokens/README.md` at head, lines 14 to 20:\n\n```text\n  seed.json              ir.json                   design-tokens.json (DTCG)\n  \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500              \u2500\u2500\u2500\u2500\u2500\u2500\u2500                   \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n  OPTIONAL               the root artifact    \u2500\u2500\u25b6   the ONLY file skills\n  a few parameters  \u2500\u2500\u25b6  semantically              read at runtime\n  + one brand hue        complete: every\n                         role, every surface,\n                         light + dark\n```\n\n### Takeaway, validation, risks\n\n- **Takeaway:** every later section cites a `DT-*` id, so a reviewer can check code against intent.\n- **Validation:** `make docs-ci` reports 0 findings over the plan files.\n- **Risk:** the plan stays in `docs/plans/` after it is done. It is marked implemented and points at the skill.\n- **Reviewer decision:** pending.\n\n## 2. One file format and one lookup\n\n**Claim.** A profile is one DTCG 2025.10 resolver document, found by one five-tier lookup that every consumer copies.\n**Motivation.** Consumers must agree on where a profile lives and how to read it, without importing each other's code (DT-TOOL-1).\n**Prerequisites.** Section 1 (DT-LOC-1, DT-DTCG-1, DT-TOOL-1).\n\n### Related files\n\n- `skills/design-profiles/scripts/profile_resolver.py` (new, 208 lines): cascade, `.default-profile`, DTCG reader\n- `skills/design-profiles/scripts/schemas/2025.10/resolver.json` (new): the DTCG resolver schema, vendored for a test\n- `skills/design-profiles/scripts/test_profile_resolver.py` (new, 14 tests)\n\n### BEFORE (base `7238ef5`)\n\nThere was no profile, so there was no lookup. Each consumer read its own files.\n\n```mermaid\nflowchart LR\n  RD[\"richdocs\"]:::process --> TH[\"its own theme folders\"]:::storage\n  MM[\"mermaidjs-diagrams\"]:::process --> PAL[\"its own palettes\"]:::storage\n  NOLOOK[\"No shared lookup\"]:::absent\n  classDef process fill:#6d28d9,stroke:#ddd6fe,color:#ffffff\n  classDef storage fill:#92400e,stroke:#fde68a,color:#ffffff\n  classDef absent fill:#f1f5f9,stroke:#475569,color:#1e293b,stroke-dasharray:5 5\n```\n\n<details>\n<summary>BEFORE detail: the two unrelated lookups<\/summary>\n\n```mermaid\nflowchart TB\n  ARG[\"--theme NAME\"]:::input --> RB[\"resolve_brand\"]:::process\n  TOK[\"--tokens FILE\"]:::input --> RB\n  RB --> SD[\"theme_search_dirs\"]:::process\n  SD --> P1[\"tmp/richdocs/theme/NAME\"]:::storage\n  SD --> P2[\"resources/themes/NAME\"]:::storage\n  RB --> DEF[\"DEFAULT_THEME osakanights\"]:::storage\n  SH[\"render_mermaid.sh\"]:::process --> MT[\"mmdc -t dark\"]:::external\n  SH --> MD[\"mmdc -t default\"]:::external\n  NOREAD[\"No DTCG reader anywhere\"]:::absent\n  classDef input fill:#1d4ed8,stroke:#bfdbfe,color:#ffffff\n  classDef process fill:#6d28d9,stroke:#ddd6fe,color:#ffffff\n  classDef storage fill:#92400e,stroke:#fde68a,color:#ffffff\n  classDef external fill:#334155,stroke:#cbd5e1,color:#ffffff\n  classDef absent fill:#f1f5f9,stroke:#475569,color:#1e293b,stroke-dasharray:5 5\n```\n\n<\/details>\n\n### AFTER (implemented, head `78ef9b1`)\n\nA name, or the default file, walks five tiers. The first hit is read as flat tokens.\n\n```mermaid\nflowchart LR\n  NAME[\"--profile NAME\"]:::input --> RP[\"resolve_profile\"]:::process\n  DFLT[\".default-profile\"]:::input --> RP\n  RP --> HIT[\"design-tokens.json\"]:::storage\n  RP --> T5[\"None: tier 5, own palettes\"]:::output\n  RP --> ERR[\"ProfileError: resolves nowhere\"]:::external\n  HIT --> RT[\"read_tokens per mode\"]:::process\n  RT --> FLAT[\"flat role to value\"]:::output\n  classDef input fill:#1d4ed8,stroke:#bfdbfe,color:#ffffff\n  classDef process fill:#6d28d9,stroke:#ddd6fe,color:#ffffff\n  classDef output fill:#047857,stroke:#a7f3d0,color:#ffffff\n  classDef storage fill:#92400e,stroke:#fde68a,color:#ffffff\n  classDef external fill:#334155,stroke:#cbd5e1,color:#ffffff\n```\n\n<details>\n<summary>AFTER detail: the cascade and the reader<\/summary>\n\n```mermaid\nflowchart TB\n  NAME[\"name argument\"]:::input --> RP[\"resolve_profile\"]:::process\n  RP -->|no name| DPN[\"default_profile_name\"]:::process\n  DPN --> M1[\"project .design-profiles/.default-profile\"]:::storage\n  DPN --> M2[\"home .design-profiles/.default-profile\"]:::storage\n  DPN -->|empty file| EMPTY[\"ProfileError: is empty\"]:::external\n  DPN -->|neither| NONE[\"return None\"]:::output\n  RP --> CD[\"candidate_dirs\"]:::process\n  CD --> C1[\"tier 1 project store\"]:::storage\n  CD --> C2[\"tier 2 home store\"]:::storage\n  CD --> C3[\"tier 3 project skill folder\"]:::storage\n  CD --> C4[\"tier 4 home skill folder\"]:::storage\n  CD -->|no hit| NOWHERE[\"ProfileError lists every path\"]:::external\n  C1 --> DOC[\"resolver document\"]:::storage\n  DOC --> MO[\"modes and default_mode\"]:::process\n  DOC --> EXT[\"extension: profile, fontStylesheet\"]:::process\n  DOC --> RT[\"read_tokens\"]:::process\n  RT --> MER[\"_merge sets of one mode\"]:::process\n  MER --> WALK[\"_walk with inherited type\"]:::process\n  WALK --> AL[\"resolve alias chains\"]:::process\n  AL -->|cycle| CYC[\"error: alias cycle\"]:::external\n  AL --> PL[\"_plain: colour to hex, alpha to 8 digits\"]:::process\n  PL --> FLAT[\"flat tokens, .default collapsed\"]:::output\n  FLAT --> GR[\"group by prefix\"]:::output\n  FLAT --> SE[\"series to ordered list\"]:::output\n  classDef input fill:#1d4ed8,stroke:#bfdbfe,color:#ffffff\n  classDef process fill:#6d28d9,stroke:#ddd6fe,color:#ffffff\n  classDef output fill:#047857,stroke:#a7f3d0,color:#ffffff\n  classDef storage fill:#92400e,stroke:#fde68a,color:#ffffff\n  classDef external fill:#334155,stroke:#cbd5e1,color:#ffffff\n```\n\n<\/details>\n\n### Data model\n\nThe file a consumer reads changed shape. BEFORE is the richdocs brandpack, AFTER is the profile.\n\n```mermaid\nerDiagram\n  BRANDPACK ||--|{ THEME_MODE : \"themes\"\n  BRANDPACK ||--|| CANVAS : \"canvas\"\n  BRANDPACK ||--|| FONTS : \"fonts\"\n```\n\n```mermaid\nerDiagram\n  RESOLVER_DOC ||--|| MODIFIER_MODE : \"modifiers.mode\"\n  MODIFIER_MODE ||--|{ CONTEXT : \"contexts light, dark\"\n  CONTEXT ||--|{ TOKEN_GROUP : \"color, surface, font\"\n  TOKEN_GROUP ||--|{ TOKEN : \"nested leaves\"\n```\n\n<details>\n<summary>Data model detail: BEFORE brandpack keys and AFTER resolver fields<\/summary>\n\nBEFORE, `resources/themes/osakanights/design-tokens.json` at base:\n\n```mermaid\nerDiagram\n  BRANDPACK {\n    string defaultTheme\n  }\n  THEME_MODE {\n    string bg\n    string fg\n    string accent\n    string surface\n    string border\n  }\n  CANVAS {\n    object cytoscape\n    object plotly\n    object deckgl\n  }\n  FONTS {\n    string display\n    string body\n    string mono\n  }\n  BRANDPACK ||--|{ THEME_MODE : \"themes\"\n  BRANDPACK ||--|| CANVAS : \"canvas\"\n  BRANDPACK ||--|| FONTS : \"fonts\"\n```\n\nAFTER, `design-tokens.json` written by `build_tokens`:\n\n```mermaid\nerDiagram\n  RESOLVER_DOC {\n    string schema \"2025.10 resolver.json\"\n    string version \"2025.10\"\n    string name \"profile name\"\n    list resolutionOrder \"ref to modifiers.mode\"\n  }\n  MODIFIER_MODE {\n    string default \"light or dark\"\n    object extensions \"profile, fontStylesheet\"\n  }\n  CONTEXT {\n    string mode \"light or dark\"\n  }\n  TOKEN_GROUP {\n    string type \"color or fontFamily\"\n  }\n  TOKEN {\n    object value \"colour, alias or font list\"\n  }\n  RESOLVER_DOC ||--|| MODIFIER_MODE : \"modifiers.mode\"\n  MODIFIER_MODE ||--|{ CONTEXT : \"contexts\"\n  CONTEXT ||--|{ TOKEN_GROUP : \"color, surface, font\"\n  TOKEN_GROUP ||--|{ TOKEN : \"nested leaves\"\n```\n\n<\/details>\n\n### Evidence\n\n`skills/design-profiles/scripts/profile_resolver.py` at head, lines 70 to 98:\n\n```python\ndef resolve_profile(\n    name: str | None,\n    skill: str,\n    project: Path | None = None,\n    home: Path | None = None,\n) -> Path | None:\n    # docstring omitted\n    project = Path.cwd() if project is None else project\n    home = Path.home() if home is None else home\n    source = \"--profile\"\n    if name is None:\n        name = default_profile_name(project, home)\n        if name is None:\n            return None\n        source = DEFAULT_FILE\n    tried = candidate_dirs(name, skill, project, home)\n    for folder in tried:\n        if (folder / TOKENS_FILE).is_file():\n            return folder / TOKENS_FILE\n    listing = \"\\n\".join(f\"  {d / TOKENS_FILE}\" for d in tried)\n    raise ProfileError(\n        f\"error: design profile {name!r} (from {source}) resolves nowhere. Tried:\\n{listing}\"\n    )\n```\n\n### Takeaway, validation, risks\n\n- **Takeaway:** \"no profile\" and \"a profile you asked for is missing\" are different outcomes. The first is tier 5, the second fails loudly.\n- **Validation:** `test_profile_resolver.py` covers the cascade order, the empty default file, alias cycles and missing modes, at 100% line coverage.\n- **Risk:** `ProfileError` subclasses `SystemExit`, so library callers must not catch broad exceptions around it.\n- **Reviewer decision:** pending.\n\n## 3. Curation bakes every surface; build only serialises\n\n**Claim.** `profiles.py` turns a few seed values into a complete IR covering every role and every surface, then writes the DTCG file with no design logic.\n**Motivation.** Consumers should rename tokens, never compute colours (DT-BUILD-1). Contrast is checked once, at curation.\n**Prerequisites.** Section 2 (the file format and `profile_resolver` reader).\n\n### Related files\n\n- `skills/design-profiles/scripts/profiles.py` (new, 1,564 lines): `Curator`, `score_contrast`, `curate_profile`, `build_tokens`, `build_lineage`, `generate`, CLI\n- `skills/design-profiles/scripts/test_profiles.py` (new, 27 tests)\n\n### BEFORE (base `7238ef5`)\n\nColours were authored by hand per theme, then checked after the fact.\n\n```mermaid\nflowchart LR\n  HAND[\"Hand-authored theme JSON\"]:::input --> GATE[\"themecheck.py\"]:::process\n  GATE --> USE[\"viewer reads it\"]:::output\n  NOCUR[\"No curation step\"]:::absent\n  classDef input fill:#1d4ed8,stroke:#bfdbfe,color:#ffffff\n  classDef process fill:#6d28d9,stroke:#ddd6fe,color:#ffffff\n  classDef output fill:#047857,stroke:#a7f3d0,color:#ffffff\n  classDef absent <script>
"use strict";
// Cytoscape graph rendering for the richdocs viewer.
//
// Inlined into its own script element BEFORE viewer.js, so these functions are
// hoisted into global scope by the time viewer.js boots. Placeholder-free by
// contract (ADR-008) — every colour comes from TOKENS.canvas.cytoscape.
//
// (Deliberately no literal script tags in this comment: a test balances the
// opening/closing tag counts in the assembled page to catch payloads that could
// break out of their script element.)
//
// Token schema (all optional except the five legacy keys, which older brandpacks
// already ship). Missing values fall back to something sane derived from the
// theme, so an old pack keeps working:
//
//   canvas.cytoscape.<light|dark> = {
//     nodeFill, nodeLabel, edge, compoundBg, compoundBorder,   // legacy, required
//     nodeBorder?, nodeFillAlt?, edgeLabel?, edgeLabelBg?,     // refinements
//     selected?, shape?, roundness?
//   }

// Cytoscape cannot read CSS custom properties — it paints to a canvas. That is
// the whole reason design-tokens.json carries a second, JS-side palette (ADR-004).
function rdCyPalette(tokens, theme) {
  var c = tokens.canvas.cytoscape[theme] || {};
  var dark = theme === "dark";
  return {
    nodeFill: c.nodeFill,
    nodeBorder: c.nodeBorder || c.nodeFill,
    nodeLabel: c.nodeLabel,
    nodeFillAlt: c.nodeFillAlt || c.compoundBg,
    edge: c.edge,
    edgeLabel: c.edgeLabel || c.nodeLabel,
    edgeLabelBg: c.edgeLabelBg || (dark ? "#000000" : "#ffffff"),
    compoundBg: c.compoundBg,
    compoundBorder: c.compoundBorder,
    selected: c.selected || c.nodeBorder || c.nodeFill,
    shape: c.shape || "round-rectangle",
    roundness: typeof c.roundness === "number" ? c.roundness : 6,
    font: tokens.fonts.body
  };
}

// ── The categorical palette (ADR-023) ───────────────────────────────────────
// A brand has ONE categorical palette: `canvas.plotly.<mode>.series`. It colours
// chart series AND the categories of every diagram (Cytoscape.js compounds,
// Mermaid subgraphs, draw.io icons). There is no separate "category colour" map:

<script>

//

// hoisted into global scope by the time viewer.js boots. Placeholder-free by
// contract (ADR-008). viewer.js calls rdInitToc() once, right after the markdown
// is parsed and before any fenced block is upgraded, so only authored headings
// are indexed, never a heading inside a rendered diagram. The theme showcase
// inlines the same file and calls rdInitToc() with its own options, so the two
// pages cannot drift apart.
//
// Both are derived entirely from the rendered headings. They hold no authoring
// state, so regenerating the page always rebuilds them (ADR-001).
//
// (Deliberately no literal script tags in this comment: a test balances the
// opening/closing tag counts in the assembled page to catch payloads that could
// break out of their script element.)

// single-column layout and the header shows no contents button.
var RD_TOC_MIN_HEADINGS = 3;
var RD_TOC_SELECTOR = "h1, h2, h3, h4";
// Only the wide layout remembers its state. The narrow drawer always opens
// closed, because a drawer remembered open would cover the article on load.
var RD_TOC_STORAGE_KEY = "richdocs-toc";
// The sidebar (16rem) plus the unchanged 52rem article column, plus gutters.
// Below this the sidebar becomes a drawer over the article.
var RD_TOC_NARROW_QUERY = "(max-width: 72rem)";

// GitHub-style slug: lower case, punctuation dropped, spaces to hyphens.
// Letters and digits in any script survive, so a heading in Japanese still
// gets a readable anchor.
function rdSlugify(text) {

    .replace(/[^\p{L}\p{N}\s_-]/gu, "")
    .replace(/\s+/g, "-");
  return slug || "section";
}

// Give every heading a stable, unique id. An id already on a heading (raw HTML
// in the markdown) is kept. Duplicates take -1, -2, … in document order, so the
// same markdown always yields the same anchors. Ids already on the page are
// reserved first, so a heading can never steal the header's own id.
// `data-rd-toc-label` overrides the entry text, for a heading whose own text is
// filled in later by script (the showcase hero shows the brand name).
function rdAssignHeadingIds(headings, doc) {
  var used = {};
  (doc || document).querySelectorAll("[id]").forEach(function (el) { used[el.id] = true; });
  return headings.map(function (h) {
    var text = (h.getAttribute("data-rd-toc-label") || h.textContent).trim();
    if (!h.id) {
      var base = rdSlugify(text);
      var id = base;

      used[id] = true;

    while (frames.length > 1 && e.level < frames[frames.length - 1].level) { frames.pop(); }

      var sub = d.createElement("ol");
      top.last.appendChild(sub);
      top = { level: e.level, list: sub, last: null };
      frames.push(top);

    var row = d.createElement("div");

function rdSetBranch(li, open) {

    head.className = "rd-fold-head rd-fold-level-" + e.level;

    btn.className = "rd-fold";

// viewer-toc.css), so a chart or diagram re-rendered while folded, on a theme

function rdSetFold(fold, open) {
  fold.button.setAttribute("aria-expanded", open ? "true" : "false");
  fold.body.hidden = !open;
}

function rdTocStored() {
  try { return localStorage.getItem(RD_TOC_STORAGE_KEY); } catch (e) { return null; }
}

function rdTocStore(state) {
  try { localStorage.setItem(RD_TOC_STORAGE_KEY, state); } catch (e) {}

// Review is opt-in and lives only in this controller's closure. Sidebar buttons

  return {
    entries: entries,
    folds: folds,
    go: go,
    setOpen: setOpen,
    isNarrow: isNarrow,
    applyLayout: applyLayout,
    refreshActive: refreshActive

<!-- Likewise rdInitZoom(), full-screen diagrams with deep zoom (ADR-024). -->
<script>
"use strict";
// Full-screen diagram viewer with deep zoom (ADR-024).
//
// Inlined into its own script element BEFORE viewer.js, so these functions are
// hoisted into global scope by the time viewer.js boots. Placeholder-free by
// contract (ADR-008). The theme showcase inlines the same file, so a diagram
// behaves the same on both pages.
//
// Three kinds of diagram, one behaviour:
//   an SVG (mermaid, draw.io, any inline svg) and a raster img open in a modal
//   on click; a Cytoscape.js graph opens from its "Full screen" button, because
//   a click inside a graph is for dragging its nodes.
//
// In the modal, the wheel zooms about the cursor and a drag pans. An SVG zooms
// through its viewBox, so it stays vector-sharp at any depth; an img zooms by
// transform; a graph is a second, fully interactive Cytoscape.js instance.
// In the page, only Ctrl/Cmd + wheel (a trackpad pinch arrives as exactly this)
// zooms a diagram in place. A plain wheel always scrolls the page: a long
// document must never trap the reader inside a diagram.
//
// (Deliberately no literal script tags in this comment: a test balances the
// opening/closing tag counts in the assembled page to catch payloads that could
// break out of their script element.)

var RD_ZOOM_DEEPEST = 40;     // furthest in, as a multiple of the fitted view
var RD_ZOOM_WIDEST = 0.5;     // furthest out in the modal, as a multiple of fit
var RD_ZOOM_STEP = 1.25;      // one button press or key press
var RD_ZOOM_WHEEL = 0.0015;   // wheel sensitivity: factor = exp(-deltaY * this)

// Zoom a viewBox about a point given in viewBox units. `factor` > 1 zooms in.
// The point stays where it is on screen. Depth is clamped relative to `base`
// (the fitted viewBox): no deeper than RD_ZOOM_DEEPEST, no wider than `widest`.
function rdZoomViewBox(vb, px, py, factor, base, widest) {
  var minW = base.w / RD_ZOOM_DEEPEST;
  var maxW = base.w / (widest || RD_ZOOM_WIDEST);
  var w = Math.min(maxW, Math.max(minW, vb.w / factor));
  var f = vb.w / w;
  return { x: px - (px - vb.x) / f, y: py - (py - vb.y) / f, w: w, h: vb.h / f };
}

// The viewBox an SVG is drawn with, or one made from its size when it has none.
function rdViewBoxOf(svg) {
  var vb = svg.getAttribute("viewBox");
  if (vb) {
    var n = vb.trim().split(/[\s,]+/).map(Number);
    if (n.length === 4 && n[2] > 0 && n[3] > 0) { return { x: n[0], y: n[1], w: n[2], h: n[3] }; }
  }
  var w = parseFloat(svg.getAttribute("width")) || 0;
  var h = parseFloat(svg.getAttribute("height")) || 0;
  if ((!w || !h) && svg.getBBox) {
    try { var b = svg.getBBox(); return { x: b.x, y: b.y, w: b.width || 1, h: b.height || 1 }; } catch (e) {}
  }
  return { x: 0, y: 0, w: w || 1, h: h || 1 };

// A zoom controller for one SVG. The default preserveAspectRatio (xMidYMid meet)
// letterboxes the viewBox into the element, which is what the maths assumes.
function rdSvgZoom(svg, widest) {
  var base = rdViewBoxOf(svg);
  var vb = { x: base.x, y: base.y, w: base.w, h: base.h };
  function apply() { svg.setAttribute("viewBox", [vb.x, vb.y, vb.w, vb.h].join(" ")); }

  // layout (a hidden element, or a test DOM) it falls back to the view's centre.
  function toSvg(cx, cy) {
    var r = svg.getBoundingClientRect();

// A zoom controller for a raster image, by transform inside the modal stage.
function rdImgZoom(img, stage) {

    reset: reset

// A zoom controller for a Cytoscape.js instance: the graph zooms and pans itself.
function rdCyZoom(cy, minLevel) {
  function level(l) { return Math.max(minLevel || 0, Math.min(l, cy.maxZoom())); }
  return {
    zoomAt: function (cx, cy2, f) {

    zoomCentre: function (f) {

// Build the modal around `content` (an element to show, or a function that fills
// the stage and returns a controller). Returns the modal's close function.

  box.className = "rd-zoom";
  box.setAttribute("role", "dialog");
  box.setAttribute("aria-modal", "true");
  box.setAttribute("aria-label", "Diagram, full screen");

  var bar = document.createElement("div");
  bar.className = "rd-zoom-bar";
  [["out", "−", "Zoom out"], ["fit", "Fit", "Fit to screen"], ["in", "+", "Zoom in"]].forEach(function (b) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.setAttribute("data-rd-zoom", b[0]);
    btn.setAttribute("aria-label", b[2]);
    btn.textContent = b[1];

  hint.className = "rd-zoom-hint";

    var b = e.target.closest ? e.target.closest("[data-rd-zoom]") : null;

  if (!box) { return; }

// max-width style; both are cleared so the copy fills the stage.
function rdZoomPicture(node) {

    clone.removeAttribute("height");

    clone.style.width = "";
    clone.style.height = "";

// positions travel with the elements, so the copy needs no second layout.

  var exclude = opts.exclude || "";

  function pictureAt(target) {
    var hit = target.closest ? target.closest(pictures) : null;
    if (!hit || hit.closest(".rd-zoom")) { return null; }

    var box = document.querySelector(".rd-zoom");
    if (!box) { return; }

    else if (ctl && (e.key === "+" || e.key === "=")) { ctl.zoomCentre(RD_ZOOM_STEP); }

  });
}

<!-- Likewise rdRenderDeckGL(): hoisted before the renderer that calls it. -->
<script>
"use strict";
// Deck.GL block renderer — `rdRenderDeckGL(block, tokens, theme)`.
//
// Inlined BEFORE viewer.js so its functions are hoisted (same contract as
// viewer-cytoscape.js). Placeholder-free by ADR-008: this is real, lintable JS.
//
// Two views, one renderer:
//
//   view: "orbit"  — a 3D scatter in a colour space. The block may hand us bare
//                    hex colours; we PROJECT them to positions ourselves.
//   view: "map"    — geographic. Positions are [lng, lat]. By default the brand
//                    canvas IS the basemap (no vendor token). A demo can opt into
//                    real tiles: `basemap` = raster (deck TileLayer), or
//                    `basemapStyle` = a vector GL style (MapLibre owns the map,
//                    deck rides as a MapboxOverlay). Both are free + keyless.
//
// The whole design rests on one idea borrowed from colour-space visualisers: a
// space is *just a projection function* rgb -> [x, y, z], plus a frame that
// describes its shape. Swap the projection and every mark in the scene moves;
// the data never changes. That is why the same block type serves a gamut study
// and a map — "where does this datum live" is the only question a layer asks.

// ── Colour maths (OKLab / OKLCH) ───────────────────────────────────────────
// OKLab is a perceptual space: L is lightness (0 black, 1 white) and the a/b
// plane carries hue+colourfulness. OKLCH is the same space in cylindrical form:
// C (chroma) is the distance from the grey axis, H (hue) the angle around it.
// Design in OKLCH because a categorical palette wants CONSTANT L (equal contrast
// against the canvas) and VARYING H — which is a horizontal ring in this space.

function rdSrgbToLinear(c) {
  return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
}

function rdLinearToSrgb(c) {
  return c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
}

function rdHexToRgb(hex) {
  var h = String(hex).trim().replace("#", "");
  if (h.length === 3) { h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2]; }
  return [
    parseInt(h.slice(0, 2), 16) / 255,
    parseInt(h.slice(2, 4), 16) / 255,
    parseInt(h.slice(4, 6), 16) / 255
  ];
}

function rdRgbToOklab(rgb) {
  var r = rdSrgbToLinear(rgb[0]), g = rdSrgbToLinear(rgb[1]), b = rdSrgbToLinear(rgb[2]);
  var l = 0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b;
  var m = 0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b;
  var s = 0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b;
  var l_ = Math.cbrt(l), m_ = Math.cbrt(m), s_ = Math.cbrt(s);
  return [
    0.2104542553 * l_ + 0.7936177850 * m_ - 0.0040720468 * s_,
    1.9779984951 * l_ - 2.4285922050 * m_ + 0.4505937099 * s_,
    0.0259040371 * l_ + 0.7827717662 * m_ - 0.8086757660 * s_
  ];
}

// Inverse: an (L, C, H) triple back to sRGB. `inGamut` is the whole point —
// most of the OKLCH cylinder is NOT representable in sRGB, and a palette that
// asks for an unrepresentable chroma gets silently clipped by the browser.
function rdOklchToRgb(L, C, H) {
  var h = (H * Math.PI) / 180;
  var a = C * Math.cos(h), b = C * Math.sin(h);
  var l_ = L + 0.3963377774 * a + 0.2158037573 * b;
  var m_ = L - 0.1055613458 * a - 0.0638541728 * b;
  var s_ = L - 0.0894841775 * a - 1.2914855480 * b;
  var l = l_ * l_ * l_, m = m_ * m_ * m_, s = s_ * s_ * s_;
  var lr = +4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s;
  var lg = -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s;
  var lb = -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s;
  var rgb = [rdLinearToSrgb(lr), rdLinearToSrgb(lg), rdLinearToSrgb(lb)];
  var eps = 0.0001;
  var inGamut = rgb.every(function (v) { return v >= -eps && v <= 1 + eps; });
  return { rgb: rgb.map(function (v) { return Math.min(1, Math.max(0, v)); }), inGamut: inGamut };
}

function rdRgbToOklch(rgb) {
  var lab = rdRgbToOklab(rgb);
  var C = Math.hypot(lab[1], lab[2]);
  var H = (Math.atan2(lab[2], lab[1]) * 180) / Math.PI;
  return { L: lab[0], C: C, H: H < 0 ? H + 360 : H };
}

// The sRGB gamut ceiling at a given (L, H): the largest chroma that still lands
// inside the cube. Binary search — cheap, and exact enough at 24 iterations.
// This is the function that explains a clipped palette: ask for C beyond this
// and you do not get it, you get this.
function rdMaxChroma(L, H) {
  var lo = 0, hi = 0.4;
  for (var i = 0; i < 24; i++) {
    var mid = (lo + hi) / 2;
    if (rdOklchToRgb(L, mid, H).inGamut) { lo = mid; } else { hi = mid; }
  }
  return lo;
}

// ── Projections: a colour space IS a function ──────────────────────────────
// Every space maps a colour into a cube of roughly [-0.5, 0.5] on each axis, so
// one camera framing works for all of them.
var RD_CHROMA_SCALE = 1.35;   // C ~0.37 (the sRGB max) -> 0.5 radius

var RD_SPACES = {
  // The raw cube. Perceptually lumpy — equal steps do not look equal.
  rgb: function (rgb) {
    return [rgb[0] - 0.5, rgb[1] - 0.5, rgb[2] - 0.5];
  },
  // Perceptual, but cartesian: hue is not an axis, so a hue ring is a circle
  // you have to infer.
  oklab: function (rgb) {
    var lab = rdRgbToOklab(rgb);
    return [lab[1] * RD_CHROMA_SCALE, lab[0] - 0.5, lab[2] * RD_CHROMA_SCALE];
  },
  // The designer's view. Height IS lightness, radius IS chroma, angle IS hue —
  // so a well-built categorical palette appears as a FLAT RING, and any swatch
  // that fell short of its chroma target is visibly closer to the centre pole.
  oklch: function (rgb) {
    var c = rdRgbToOklch(rgb);
    var h = (c.H * Math.PI) / 180;
    return [
      Math.cos(h) * c.C * RD_CHROMA_SCALE,
      c.L - 0.5,
      Math.sin(h) * c.C * RD_CHROMA_SCALE
    ];
  }
};

function rdProject(space, hex) {
  return (RD_SPACES[space] || RD_SPACES.oklch)(rdHexToRgb(hex));
}

function rdRgb255(hex, alpha) {
  var c = rdHexToRgb(hex);
  return [
    Math.round(c[0] * 255),
    Math.round(c[1] * 255),
    Math.round(c[2] * 255),
    alpha === undefined ? 255 : alpha
  ];
}

// ── Frame: the guides that make a space legible ────────────────────────────
// A scatter with no frame is a cloud of dots. The frame says "this axis is
// lightness, this ring is the edge of what sRGB can show".
function rdFrameLines(space, gamutLs, ink) {
  var lines = [];
  if (space === "rgb") { return lines; }

  // The achromatic pole: every grey, from black to white.
  lines.push({ source: [0, -0.5, 0], target: [0, 0.5, 0], color: ink });

  // One ring per requested lightness = the sRGB gamut boundary at that L.
  // A palette swatch sitting ON this ring got the chroma it asked for; one
  // sitting inside it did not.
  gamutLs.forEach(function (L) {
    var prev = null;
    for (var deg = 0; deg <= 360; deg += 4) {
      var maxC = space === "oklch" ? rdMaxChroma(L, deg) : rdMaxChroma(L, deg);
      var h = (deg * Math.PI) / 180;
      var pt = [Math.cos(h) * maxC * RD_CHROMA_SCALE, L - 0.5, Math.sin(h) * maxC * RD_CHROMA_SCALE];
      if (prev) { lines.push({ source: prev, target: pt, color: ink }); }
      prev = pt;
    }
  });
  return lines;
}

// `targetChroma` is the chroma the palette ASKED for — a design intent the
// renderer cannot infer, because a hex only records what was actually granted.
// Given it, we can draw the request as a TRUE CIRCLE at that chroma.
//
// The whole story is then one picture: a perfect circle (what you asked for)
// against a lumpy blob (what sRGB can give you). Wherever the circle escapes
// the blob, the request was impossible — and every swatch in that arc is pinned
// to the blob, short of its target.
function rdTargetRing(L, targetC, color) {
  var lines = [];
  var prev = null;
  for (var deg = 0; deg <= 360; deg += 4) {
    var h = (deg * Math.PI) / 180;
    var pt = [Math.cos(h) * targetC * RD_CHROMA_SCALE, L - 0.5, Math.sin(h) * targetC * RD_CHROMA_SCALE];
    if (prev) { lines.push({ source: prev, target: pt, color: color }); }
    prev = pt;
  }
  return lines;
}

// The clipping tell: for each swatch, a spoke from where it LANDED out to where
// it was AIMED. Drawn only when the ceiling at that hue is below the target —
// i.e. only when the colour was actually denied. A swatch with chroma to spare
// gets no spoke: it is not clipped, it is simply not maximal.
function rdClipSpokes(data, targetC, warn) {
  var spokes = [];
  data.forEach(function (d) {
    if (!d.hex) { return; }
    var c = rdRgbToOklch(rdHexToRgb(d.hex));
    var maxC = rdMaxChroma(c.L, c.H);
    if (maxC >= targetC - 0.004) { return; }   // reachable — nothing was denied
    var h = (c.H * Math.PI) / 180;
    spokes.push({
      source: [Math.cos(h) * c.C * RD_CHROMA_SCALE, c.L - 0.5, Math.sin(h) * c.C * RD_CHROMA_SCALE],
      target: [Math.cos(h) * targetC * RD_CHROMA_SCALE, c.L - 0.5, Math.sin(h) * targetC * RD_CHROMA_SCALE],
      color: warn
    });
  });
  return spokes;
}

// ── Render ─────────────────────────────────────────────────────────────────
// Canvas renderers cannot read CSS custom properties (ADR-004), so the palette
// arrives as tokens. `canvas.deckgl.<mode>` is optional and falls back to the
// plotly sub-palette, which every brandpack already ships.
function rdDeckPalette(tokens, theme) {
  var canvas = tokens.canvas || {};
  var dg = (canvas.deckgl || {})[theme];
  var pl = (canvas.plotly || {})[theme] || {};
  var th = (tokens.themes || {})[theme] || {};
  var status = ((tokens.status || {})[theme] || {}).colours || {};
  return {
    background: (dg && dg.background) || pl.plot || "#101010",
    // The frame is a GUIDE, so it takes the muted-text token — not the plotly
    // `grid` colour, which is tuned to sit behind a 2D chart and vanishes
    // against a 3D scene's own background.
    ink: (dg && dg.ink) || th.muted || pl.grid || "#858585",
    text: (dg && dg.text) || pl.font || th.fg || "#dddddd",
    // Clipping is a warning, and the brand already owns a warning colour.
    warn: (dg && dg.warn) || status.warning || "#ebb25f",
    series: pl.series || []
  };
}

// A layer spec is `{ type, data, ...props }` and `type` is looked up on deck's
// global. That keeps the block OPEN — any deck.gl layer works without a code
// change here — while the projection sugar below stays specific to colour work.
function rdBuildLayers(spec, pal) {
  var space = spec.space || "oklch";
  var isOrbit = spec.view !== "map";
  var layers = [];

  // A map view draws NO basemap by default — the brand canvas IS the basemap, so no
  // vendor tiles or key are needed. But a demo can opt into real tiles with
  // `basemap: true` (OSM) or `basemap: "<url template>"`; it goes UNDER everything.
  if (!isOrbit && spec.basemap) {
    var tileUrl = spec.basemap === true
      ? "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
      : spec.basemap;
    layers.push(new deck.TileLayer({
      id: "rd-basemap",
      data: tileUrl,
      minZoom: 0,
      maxZoom: 19,
      tileSize: 256,
      renderSubLayers: function (props) {
        var bb = props.tile.boundingBox;  // [[west, south], [east, north]]
        return new deck.BitmapLayer(props, {
          data: null,
          image: props.data,
          bounds: [bb[0][0], bb[0][1], bb[1][0], bb[1][1]]
        });
      }
    }));
  }

  if (isOrbit && spec.gamut && spec.gamut.length) {
    var frame = rdFrameLines(space, spec.gamut, rdRgb255(pal.ink, 200));
    // The requested chroma, drawn as the circle it actually is. Where it sits
    // outside the gamut ring, the design asked for a colour that does not exist.
    if (spec.targetChroma) {
      spec.gamut.forEach(function (L) {
        frame = frame.concat(rdTargetRing(L, spec.targetChroma, rdRgb255(pal.warn, 130)));
      });
    }
    layers.push(new deck.LineLayer({
      id: "rd-frame",
      data: frame,
      getSourcePosition: function (d) { return d.source; },
      getTargetPosition: function (d) { return d.target; },
      getColor: function (d) { return d.color; },
      getWidth: 1.5
    }));
  }

  (spec.layers || []).forEach(function (raw, i) {
    var props = Object.assign({}, raw);
    var type = props.type;
    delete props.type;
    if (!deck[type]) { throw new Error("unknown deck.gl layer type: " + type); }
    if (props.id === undefined) { props.id = "rd-layer-" + i; }

    // Lighting OFF by default. deck.gl's lit layers (PointCloudLayer, ColumnLayer,
    // …) shade every mark as a 3D solid under an ambient+directional light, which
    // DARKENS the fill — so a swatch renders muddier than its own hex. In a
    // colour-space visualiser the mark IS a colour claim; a lit mark makes that
    // claim false (the dot no longer matches the flat swatch). Flat/unlit is the
    // only colour-correct default. An author who genuinely wants shaded geometry
    // opts back in by putting `material` on the layer spec.
    if (props.material === undefined) { props.material = false; }

    // Pickable by default so hover tooltips (getTooltip) actually fire — a deck.gl
    // layer is NOT pickable unless asked, and a silent non-pickable layer looks
    // identical until you try to hover it. The basemap tile layer opts out below.
    if (props.pickable === undefined) { props.pickable = true; }

    // Sugar: a datum carrying `hex` needs neither a position nor a colour. We
    // derive BOTH from the colour itself — the datum IS its own coordinate.
    // This is what lets a palette be authored as a plain list of hex strings.
    var data = props.data || [];
    if (isOrbit && Array.isArray(data) && data.length && data[0] && data[0].hex) {
      if (props.getPosition === undefined) {
        props.getPosition = function (d) { return rdProject(space, d.hex); };
      }
      if (props.getColor === undefined && props.getFillColor === undefined) {
        props.getColor = function (d) { return rdRgb255(d.hex); };
        props.getFillColor = function (d) { return rdRgb255(d.hex); };
      }
      if (spec.targetChroma) {
        layers.push(new deck.LineLayer({
          id: props.id + "-clip",
          data: rdClipSpokes(data, spec.targetChroma, rdRgb255(pal.warn, 235)),
          getSourcePosition: function (d) { return d.source; },
          getTargetPosition: function (d) { return d.target; },
          getColor: function (d) { return d.color; },
          getWidth: 3
        }));
      }
    } else if (Array.isArray(data) && data.length && data[0] && data[0].position) {
      // A point cloud that is NOT a colour space (e.g. a reduced text embedding):
      // each datum carries its own `position` and `color`. PointCloudLayer's default
      // getColor is a CONSTANT black, so a `color` field would otherwise never show —
      // wire the accessors here so the topic colours actually render.
      if (props.getPosition === undefined) {
        props.getPosition = function (d) { return d.position; };
      }
      if (data[0].color && props.getColor === undefined && props.getFillColor === undefined) {
        props.getColor = function (d) { return d.color; };
        props.getFillColor = function (d) { return d.color; };
      }
    }
    layers.push(new deck[type](props));
  });

  return layers;
}

// The tooltip closure is shared by the plain-Deck path and the MapLibre-overlay
// path, so a datum reads the same whether the scene rides a WebGL canvas or a
// vector basemap. Factored out of rdRenderDeckGL for exactly that reuse.
function rdTooltip(spec, pal, tokens) {
  return function (info) {
    if (!info.object) { return null; }
    var o = info.object;
    // A point cloud of text (an embedding) shows the ACTUAL chunk, wrapped, with
    // its topic as a header — that is the whole point of a RAG-debugging view.
    if (o.text) {
      return {
        text: (o.topic ? o.topic.toUpperCase() + "\n" : "") + o.text,
        style: {
          background: pal.background, color: pal.text, fontFamily: tokens.fonts.body,
          fontSize: "12px", border: "1px solid " + pal.ink, borderRadius: "6px",
          padding: "8px 10px", maxWidth: "320px", whiteSpace: "normal", lineHeight: "1.4"
        }
      };
    }
    var label = o.label || o.name || o.hex;
    if (!label) { return null; }
    var body = label;
    if (o.hex) {
      var c = rdRgbToOklch(rdHexToRgb(o.hex));
      var maxC = rdMaxChroma(c.L, c.H);
      var target = spec.targetChroma;
      body += "\nL " + c.L.toFixed(3) + "  C " + c.C.toFixed(3) + "  H " + c.H.toFixed(1) + "°";
      body += "\nsRGB ceiling here: " + maxC.toFixed(3);
      // Two different facts, never conflated: sitting AT the ceiling is a
      // property of the hue; being CLIPPED needs a request to fall short of.
      if (c.C >= maxC - 0.004) { body += "\nat the sRGB ceiling"; }
      if (target && maxC < target - 0.004) {
        body += "\nCLIPPED: asked " + target.toFixed(3)
          + ", denied " + (target - maxC).toFixed(3);
      }
    }
    return {
      text: body,
      style: {
        background: pal.background, color: pal.text, fontFamily: tokens.fonts.mono,
        fontSize: "11px", border: "1px solid " + pal.ink, borderRadius: "6px",
        padding: "6px 8px", whiteSpace: "pre"
      }
    };
  };
}

function rdRenderDeckGL(block, tokens, theme) {
  var spec = block.payload;
  var pal = rdDeckPalette(tokens, theme);
  var isOrbit = spec.view !== "map";

  block.el.style.height = (spec.height || 460) + "px";
  block.el.style.background = pal.background;
  block.el.style.position = "relative";

  // A re-render must not leak the old scene. The Deck path holds a WebGL context;
  // the MapLibre path holds its own map + canvas. Tear down whichever this block
  // built last, so a theme flip rebuilds cleanly either way.
  if (block.deck) { block.deck.finalize(); block.deck = null; }
  if (block.map) { block.map.remove(); block.map = null; block.overlay = null; }

  var getTooltip = rdTooltip(spec, pal, tokens);

  // Vector-basemap path: MapLibre owns the map + camera, deck.gl rides on top as a
  // MapboxOverlay. A real dark basemap needs no vendor key (CartoDB ships a free GL
  // style), and MapLibre's tile pipeline is far more robust than a hand-rolled
  // raster TileLayer — which is exactly why a raster basemap can silently blank on
  // a flaky network while this keeps its tiles. `basemap` (raster) stays supported
  // for docs that want no MapLibre dependency; `basemapStyle` (vector) opts into this.
  if (!isOrbit && spec.basemapStyle && typeof maplibregl !== "undefined" && deck.MapboxOverlay) {
    var v = spec.initialViewState || {};
    block.map = new maplibregl.Map({
      container: block.el,
      style: spec.basemapStyle,
      center: [v.longitude || 0, v.latitude || 0],
      zoom: v.zoom || 1.2,
      pitch: v.pitch || 0,
      bearing: v.bearing || 0,
      interactive: spec.controller !== false,
      attributionControl: { compact: true }
    });
    block.overlay = new deck.MapboxOverlay({
      interleaved: false,
      layers: rdBuildLayers(spec, pal),
      getTooltip: getTooltip
    });
    block.map.addControl(block.overlay);
    return;
  }

  var view = isOrbit
    ? new deck.OrbitView({ id: "orbit", orbitAxis: "Y", fovy: 50 })
    : new deck.MapView({ id: "map", repeat: true });

  // OrbitView `zoom` is log2(pixels per world unit) — NOT a map zoom. Every
  // space here is normalised to a ~1-unit extent, so the scene needs ~2^9 to
  // fill the canvas. Framing it like a map (zoom 1-5) renders a correct scene
  // the size of a postage stamp: the classic OrbitView trap.
  //
  // A gamut study is a horizontal SLAB at some lightness, not the whole solid,
  // so the camera centres on that slab (y = L - 0.5) and pulls in tighter.
  // Left at the origin, the subject drifts to the top of the frame.
  var gamut = (isOrbit && spec.gamut) || [];
  var meanL = gamut.length
    ? gamut.reduce(function (a, b) { return a + b; }, 0) / gamut.length
    : 0.5;
  var initialViewState = spec.initialViewState || (isOrbit
    ? {
      target: [0, meanL - 0.5, 0],
      zoom: gamut.length ? 9.5 : 8.6,
      rotationX: 30,
      rotationOrbit: -28,
      minZoom: 7,
      maxZoom: 12
    }
    : { longitude: 0, latitude: 20, zoom: 1.2 });

  block.deck = new deck.Deck({
    parent: block.el,
    views: view,
    initialViewState: initialViewState,
    controller: spec.controller !== false,
    useDevicePixels: true,
    parameters: { clearColor: rdRgb255(pal.background).map(function (v) { return v / 255; }) },
    layers: rdBuildLayers(spec, pal),
    getTooltip: getTooltip
  });
}

</script>
<script>
"use strict";
// Runtime renderer for the paired-markdown viewer.
//
// Boot order: tokens -> CSS vars -> markdown -> marked.parse -> fenced-block
// upgrades. Tokens land first so nothing paints in fallback colours.
//
// This file contains NO template placeholders — it is copied verbatim into the
// output and is therefore real, lintable JS. Everything md2html.py needs to
// inject (build id, source name, CDN pins, fallback tokens) arrives through the
// #rd-config JSON block in viewer.html. Keep it that way: the moment a mustache
// placeholder appears here, the file stops parsing and stops being editable as
// JavaScript. A test enforces this (ADR-008).
var CFG = JSON.parse(document.getElementById("rd-config").textContent);

var BUILD_ID = CFG.buildId;
var SOURCE = CFG.source;
var CDN = CFG.cdn;
var FALLBACK_TOKENS = CFG.fallbackTokens;
// Paired with the doc — a shared filename let one doc clobber another's brand.
var TOKENS_SOURCE = CFG.tokensSource || "design-tokens.json";
var TOKENS = FALLBACK_TOKENS;

var cyBlocks = [];       // { el, payload, cy } — kept for re-theming
var plotlyBlocks = [];   // { el, payload }
var deckBlocks = [];     // { el, payload, deck } — holds a WebGL context; finalized on re-theme
var mermaidSources = []; // { el, src }
var lazyLoaded = {};

function currentTheme() {
  return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
}

// CSS can reach the chrome; canvas renderers cannot. Hence two palettes in the
// token file, and hence this function only handles the CSS half (ADR-004).
// One `accent` used to do three incompatible jobs: the brand FILL, the TEXT ON
// that fill, and a TEXT-SAFE accent for headings and links. Most brands get away
// with it. A brand whose accent is a bright yellow does not — yellow is 1.64:1 on
// white, so it can be a surface but never a text colour. Forcing it through one
// token means a brand must either ship an illegible page or quietly substitute a
// colour it does not own. Both happened. Hence three tokens, with fallbacks so an
// older pack keeps working.
function accentRoles(t) {
  return {
    fill: t.accent,                    // surfaces, CTA fills, active states
    on: t.onAccent || t.bg,            // text that sits ON the fill
    link: t.link || t.accent           // headings, links — must be text-safe
  };
}

function applyTokenCss(tokens) {
  var css = "";
  // A typeface is a brand VALUE, so it belongs in the pack. `fonts.display` is
  // optional and falls back to body — a brand with one face needn't declare two.
  // (theme.css still has to @import the webfile; *choosing* a face and *loading*
  // one are different jobs.)
  var display = tokens.fonts.display || tokens.fonts.body;
  ["light", "dark"].forEach(function (theme) {
    var t = tokens.themes[theme];
    var a = accentRoles(t);
    css += ":root[data-theme=" + theme + "]{"
      + "--rd-bg:" + t.bg + ";--rd-fg:" + t.fg + ";--rd-muted:" + t.muted + ";"
      + "--rd-accent:" + a.fill + ";--rd-on-accent:" + a.on + ";--rd-link:" + a.link + ";"
      + "--rd-surface:" + t.surface + ";--rd-border:" + t.border + ";"
      + "--rd-radius:" + (t.radius !== undefined ? t.radius : "8px") + ";"
      + "--rd-font-body:" + tokens.fonts.body + ";--rd-font-mono:" + tokens.fonts.mono + ";"
      + "--rd-font-display:" + display + ";}";
  });
  var style = document.getElementById("rd-token-css");
  if (!style) {
    style = document.createElement("style");
    style.id = "rd-token-css";
    document.head.appendChild(style);
  }
  style.textContent = css;
}

function loadScript(name, url) {
  if (lazyLoaded[name]) return lazyLoaded[name];
  lazyLoaded[name] = new Promise(function (resolve, reject) {
    var s = document.createElement("script");
    s.src = url;
    s.onload = resolve;
    s.onerror = function () { reject(new Error("failed to load " + url)); };
    document.head.appendChild(s);
  });
  return lazyLoaded[name];
}

// ?v=BUILD_ID + no-store: the whole point of the live-authoring loop is that a
// browser refresh shows the edited markdown, never a cached copy.
function fetchNoStore(url) {
  return fetch(url + "?v=" + BUILD_ID, { cache: "no-store" }).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status + " fetching " + url);
    return r;
  });
}

function showError(el, err) {
  var div = document.createElement("div");
  div.className = "rd-error";
  div.textContent = String(err && err.message ? err.message : err);
  el.replaceChildren(div);
  console.error(err);
}

// ── Mermaid ────────────────────────────────────────────────────────────────
// Rendered mermaid SVG is not re-themable in place: it must be re-rendered from
// source on every theme flip.
//
// `fontFamily`: mermaid otherwise measures labels in its own default (`trebuchet
// ms`) while the page paints them in the brand face (viewer.css sets `font-family:
// var(--rd-font-body)` on body). Hand mermaid the same token plotly already gets
// (see renderPlotly) so it measures the face it renders, and so diagrams stop
// rendering off-brand. This narrows the label-box shortfall but does NOT close it;
// viewer.css `foreignObject { overflow: visible }` is what actually stops the clip.
//
// `fonts.ready`: a theme @imports its face with `display=swap`, so measuring before
// the face loads silently measures the fallback. Guarded, because the Font Loading
// API is absent in a few older engines.
function renderAllMermaid() {
  if (mermaidSources.length === 0) return Promise.resolve();
  window.mermaid.initialize({
    startOnLoad: false,
    theme: currentTheme() === "dark" ? "dark" : "default",
    fontFamily: TOKENS.fonts.body,
    securityLevel: "loose"
  });
  var fontsReady = (document.fonts && document.fonts.ready)
    ? document.fonts.ready
    : Promise.resolve();
  return fontsReady.then(function () {
    var seq = Promise.resolve();
    mermaidSources.forEach(function (m, i) {
      seq = seq.then(function () {
        return window.mermaid.render("rd-mmd-" + BUILD_ID + "-" + i + "-" + currentTheme(), m.src)
          .then(function (out) { m.el.innerHTML = out.svg; })
          .catch(function (err) { showError(m.el, err); });
      });
    });
    return seq;
  });
}

// ── Cytoscape ──────────────────────────────────────────────────────────────
// Graph styling lives in viewer-cytoscape.js (loaded before this file) so the
// visual design is editable on its own, not buried in the boot logic.
function renderCytoscape(block) {
  rdRenderCytoscape(block, TOKENS, currentTheme());
}

function loadCytoscapeLibs() {
  return loadScript("cytoscape", CDN.cytoscape)
    .then(function () { return loadScript("dagre", CDN.dagre); })
    .then(function () { return loadScript("cytoscapeDagre", CDN.cytoscapeDagre); })
    .then(function () { window.cytoscape.use(window.cytoscapeDagre); });
}

// ── Plotly ─────────────────────────────────────────────────────────────────
function plotlyLayout(payload) {
  var p = TOKENS.canvas.plotly[currentTheme()];
  var layout = Object.assign({}, payload.layout || {});
  layout.paper_bgcolor = p.paper;
  layout.plot_bgcolor = p.plot;
  layout.font = Object.assign({}, layout.font || {}, { color: p.font, family: TOKENS.fonts.body });
  layout.colorway = p.series;
  layout.xaxis = Object.assign({}, layout.xaxis || {}, { gridcolor: p.grid });
  layout.yaxis = Object.assign({}, layout.yaxis || {}, { gridcolor: p.grid });
  return layout;
}

// `responsive: true` makes Plotly size itself to its PARENT — and .rd-canvas has
// no height of its own, so without this the plot measures a content-driven box
// and collapses to a squashed sliver. Every block type owes its renderer an
// explicit container height; cytoscape and deckgl already do this.
function renderPlotly(block) {
  block.el.style.height = (block.payload.height || 420) + "px";
  return window.Plotly.react(block.el, block.payload.data, plotlyLayout(block.payload), { responsive: true });
}

// ── Deck.GL ────────────────────────────────────────────────────────────────
// 3D / geographic scenes. Scene construction lives in viewer-deckgl.js (loaded
// before this file) so the visualisation design is editable on its own.
function renderDeckGL(block) {
  rdRenderDeckGL(block, TOKENS, currentTheme());
}

// ── Fenced-block upgrade ───────────────────────────────────────────────────
// A block's `data` may be a URL string instead of inline data — fetch and merge.
function resolvePayload(raw) {
  var payload = JSON.parse(raw);
  if (typeof payload.data === "string") {
    return fetchNoStore(payload.data).then(function (r) { return r.json(); }).then(function (remote) {
      if (Array.isArray(remote)) {
        payload.data = remote;
      } else {
        delete payload.data;
        payload = Object.assign({}, remote, payload);
      }
      return payload;
    });
  }
  return Promise.resolve(payload);
}

// cytoscape/dagre/plotly are injected only when a doc actually uses them, so a
// plain prose doc pays for none of them.
function upgradeFences(article) {
  var jobs = [];
  article.querySelectorAll("pre > code").forEach(function (code) {
    var lang = (code.className.match(/language-([\w-]+)/) || [])[1];
    if (lang !== "mermaid" && lang !== "cytoscape" && lang !== "plotly" && lang !== "deckgl") return;
    var pre = code.parentElement;
    var div = document.createElement("div");
    div.className = "rd-canvas rd-" + lang;
    pre.replaceWith(div);
    var raw = code.textContent;
    if (lang === "mermaid") {
      mermaidSources.push({ el: div, src: raw });
      return;
    }
    jobs.push(resolvePayload(raw).then(function (payload) {
      var block = { el: div, payload: payload };
      if (lang === "cytoscape") { cyBlocks.push(block); }
      else if (lang === "deckgl") { deckBlocks.push(block); }
      else { plotlyBlocks.push(block); }
    }).catch(function (err) { showError(div, err); }));
  });

  return Promise.all(jobs).then(function () {
    var loads = [];
    if (cyBlocks.length) loads.push(loadCytoscapeLibs());
    if (plotlyBlocks.length) loads.push(loadScript("plotly", CDN.plotly));
    if (deckBlocks.length) loads.push(loadScript("deckgl", CDN.deckgl));
    return Promise.all(loads);
  }).then(function () {
    cyBlocks.forEach(function (b) { try { renderCytoscape(b); } catch (e) { showError(b.el, e); } });
    plotlyBlocks.forEach(function (b) { renderPlotly(b).catch(function (e) { showError(b.el, e); }); });
    deckBlocks.forEach(function (b) { try { renderDeckGL(b); } catch (e) { showError(b.el, e); } });
    return renderAllMermaid();
  });
}

// Highlight ordinary language-tagged snippets. Rich blocks keep their own
// renderer; unknown languages retain readable escaped source with no guessing.
function highlightCode(article) {
  var blocks = Array.prototype.slice.call(article.querySelectorAll("pre > code")).filter(function (code) {
    var lang = (code.className.match(/language-([\w-]+)/) || [])[1];
    return lang && ["mermaid", "cytoscape", "plotly", "deckgl"].indexOf(lang) === -1;
  });
  if (!blocks.length) return Promise.resolve();
  return loadScript("highlight", CDN.highlight).then(function () {
    blocks.forEach(function (code) {
      var lang = (code.className.match(/language-([\w-]+)/) || [])[1];
      if (window.hljs.getLanguage(lang)) window.hljs.highlightElement(code);
    });
  }).catch(function (err) {
    // A CDN failure must not hide the source or stop diagram upgrades.
    console.warn("Syntax highlighting unavailable", err);
  });
}

function wrapTables(article) {
  article.querySelectorAll("table").forEach(function (table) {
    var wrap = document.createElement("div");
    wrap.className = "rd-table-wrap";
    table.replaceWith(wrap);
    wrap.appendChild(table);
  });
}

// ── Theme toggle ───────────────────────────────────────────────────────────
// CSS vars flip themselves; the canvas renderers must be re-fed by hand.
function retheme() {
  cyBlocks.forEach(function (b) { try { renderCytoscape(b); } catch (e) { showError(b.el, e); } });
  plotlyBlocks.forEach(function (b) { renderPlotly(b).catch(function (e) { showError(b.el, e); }); });
  deckBlocks.forEach(function (b) { try { renderDeckGL(b); } catch (e) { showError(b.el, e); } });
  renderAllMermaid();
}

document.getElementById("rd-theme-toggle").addEventListener("click", function () {
  var next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("richdocs-theme", next); } catch (e) {}
  retheme();
});

// ── Boot ───────────────────────────────────────────────────────────────────
// --inline mode pre-seeds window.__DOC_*__; multi-file mode fetches.
function loadTokens() {
  if (window.__DOC_TOKENS__ !== undefined) return Promise.resolve(window.__DOC_TOKENS__);
  return fetchNoStore(TOKENS_SOURCE).then(function (r) { return r.json(); })
    .catch(function (err) {
      console.error(TOKENS_SOURCE + " fetch failed; using baked fallback tokens", err);
      return FALLBACK_TOKENS;
    });
}

function loadDoc() {
  if (window.__DOC_MD__ !== undefined) return Promise.resolve(window.__DOC_MD__);
  return fetchNoStore(SOURCE).then(function (r) { return r.text(); });
}

loadTokens().then(function (tokens) {
  TOKENS = tokens;
  applyTokenCss(tokens);
  return loadDoc();
}).then(function (md) {
  var article = document.getElementById("rd-article");
  article.innerHTML = window.marked.parse(md);
  wrapTables(article);
  // Before the fence upgrades, so only authored headings are indexed (ADR-021).
  rdInitToc(article);
  return Promise.all([upgradeFences(article), highlightCode(article)]);
}).catch(function (err) {
  showError(document.getElementById("rd-article"), err);
});

// ── Full-screen diagrams with deep zoom (viewer-zoom.js, ADR-024) ──────────
// Any picture in the article opens full screen on click: an img, an inline svg,
// a rendered mermaid diagram. Plotly and deck.gl are interactive surfaces with
// their own zoom, so their SVGs are excluded. A Cytoscape.js graph opens from its
// own "Full screen" button. Delegated from document, so it survives re-renders.
rdInitZoom({
  pictures: "#rd-article img, #rd-article svg",
  exclude: ".rd-plotly, .rd-deckgl, .rd-cytoscape"
});

</script>
</body>
</html>
