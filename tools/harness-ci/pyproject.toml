[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "harness-ci"
version = "0.1.0"
description = "Isolated plugin installation checks for supported agent harnesses"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
harness-ci = "harness_ci.app:main"

[dependency-groups]
dev = ["complexipy>=5", "mypy>=1.15", "pytest>=8", "pytest-cov>=6", "ruff>=0.11"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "RUF"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=harness_ci --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true

[tool.complexipy]
max-complexity-allowed = 15
